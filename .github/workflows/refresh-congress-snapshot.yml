name: Refresh congress activity snapshot

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python build_congress_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congress_activity_summary.json
          git diff --cached --quiet || git commit -m "Refresh congress activity snapshot"
          git push
