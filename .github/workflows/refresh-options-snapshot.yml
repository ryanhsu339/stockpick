name: Refresh options snapshot

# Weekdays before the US open (8:45 ET in winter, 7:45 in summer), once the
# previous session's open interest has posted. Its own workflow rather than a
# step in the daily snapshots: it makes a few thousand throttled Yahoo
# requests and takes 10-20 minutes. See build_options_snapshot.py.
on:
  schedule:
    - cron: "45 12 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python build_options_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/options_ratio_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh options snapshot"
          # Another snapshot job may have pushed to main during the run;
          # rebase this one data commit on top.
          git pull --rebase origin main
          git push
