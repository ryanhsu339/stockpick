name: Refresh data snapshots

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Default --quarters-back 1: a filer only needs to show up in one
      # recent quarter's index to stay listed, so the daily run only
      # needs the current quarter, not a full rescan (see
      # build_manager_directory.py for the one-time backfill).
      - run: python build_manager_directory.py

      - run: python build_ticker_map.py

      # Last, and independent of the two above: it depends on the House and
      # Senate disclosure sites, and when either refuses (the Senate site
      # has been returning 403 since 2026-10-23), the other snapshots should
      # still refresh. A failure here still fails the run, so it's visible.
      - run: python build_congress_snapshot.py

      # always(): commit whatever did refresh, even if a step above failed --
      # the build scripts only write a file once it's fully built, so a
      # failed step leaves its committed snapshot as it was.
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congress_activity_summary.json data/congress_member_positions.json data/thirteenf_manager_directory.json data/ticker_map.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh data snapshots"
          # Someone else may have pushed to main during the run (what failed
          # the 2026-10-16 run); rebase this one data commit on top.
          git pull --rebase origin main
          git push
