name: Refresh data snapshots

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python build_congress_snapshot.py

      # Default --quarters-back 1: a filer only needs to show up in one
      # recent quarter's index to stay listed, so the daily run only
      # needs the current quarter, not a full rescan (see
      # build_manager_directory.py for the one-time backfill).
      - run: python build_manager_directory.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congress_activity_summary.json data/congress_member_positions.json data/thirteenf_manager_directory.json
          git diff --cached --quiet || git commit -m "Refresh data snapshots"
          git push
